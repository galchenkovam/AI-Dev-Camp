<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Household Chores{% endblock %}</title>
    <style>
        :root {
            color-scheme: light;
            --bg: #f3f6fb;
            --panel: #ffffff;
            --border: #dbe3ee;
            --text: #1f2a37;
            --muted: #5c6b7a;
            --accent: #2a9d8f;
            --accent-dark: #1f6d63;
            --danger: #b42318;
            --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 1rem;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: var(--shadow);
            padding: 1rem 1.25rem;
        }

        h1, h2, h3 {
            margin-top: 0;
        }

        p, ul, dl {
            margin-top: 0;
        }

        .messages {
            margin: 0 0 1rem;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            background: #edf7ed;
            border: 1px solid #cfe8d3;
            color: #1e4d2b;
        }

        .messages.error {
            background: #fff1f1;
            border-color: #f7c5c1;
            color: var(--danger);
        }

        form {
            display: grid;
            gap: 0.75rem;
        }

        .form-field {
            display: grid;
            gap: 0.35rem;
        }

        .help-text {
            color: var(--muted);
            font-size: 0.9rem;
        }

        .help-text ul,
        .field-errors ul,
        .form-errors ul {
            margin: 0;
            padding-left: 1.25rem;
        }

        .field-errors,
        .form-errors {
            color: var(--danger);
            font-size: 0.9rem;
            font-weight: 600;
        }

        input[aria-invalid="true"] {
            border-color: var(--danger);
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.35rem;
        }

        input, select, textarea, button {
            width: 100%;
            max-width: 100%;
            padding: 0.7rem 0.8rem;
            border-radius: 10px;
            border: 1px solid var(--border);
            font: inherit;
        }

        button {
            background: var(--accent);
            color: #fff;
            border: none;
            cursor: pointer;
            font-weight: 700;
        }

        button.secondary {
            background: #eef4ff;
            color: var(--text);
            border: 1px solid var(--border);
        }

        .stack {
            display: grid;
            gap: 1rem;
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            overflow: hidden;
        }

        th, td {
            padding: 0.6rem;
            border-bottom: 1px solid var(--border);
            text-align: left;
            vertical-align: top;
        }

        .muted {
            color: var(--muted);
        }

        .category-label {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            border-left: 0.35rem solid var(--category-color);
            padding-left: 0.35rem;
        }

        @media (max-width: 640px) {
            .container {
                padding: 0.75rem;
            }

            .panel {
                padding: 0.9rem;
            }

            table, thead, tbody, tr, th, td {
                display: block;
                width: 100%;
            }

            thead { display: none; }

            tr {
                border: 1px solid var(--border);
                border-radius: 10px;
                margin-bottom: 0.75rem;
                background: #fff;
                padding: 0.5rem;
            }

            td {
                border: none;
                padding: 0.35rem 0.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="messages" role="status" aria-live="polite">
            {% if messages %}
                {% for message in messages %}
                    <div{% if message.tags %} class="{{ message.tags }}"{% endif %}>{{ message }}</div>
                {% endfor %}
            {% else %}
                <div class="sr-only">No messages.</div>
            {% endif %}
        </div>
        {% block content %}{% endblock %}
    </div>
</body>
</html>
