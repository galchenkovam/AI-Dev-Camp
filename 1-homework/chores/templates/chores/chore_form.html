{% extends "base.html" %}
{% block title %}{% if chore %}Edit{% else %}Create{% endif %} chore{% endblock %}
{% block content %}
<div class="panel">
    <h1>{% if chore %}Edit{% else %}Create{% endif %} chore</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Save chore</button>
    </form>
    <div class="row">
        <a href="{% url 'household-detail' household.id %}">Household home</a>
        <a href="{% url 'chore-list' household.id %}">Chores</a>
        <a href="{% url 'chore-calendar' household.id %}">Calendar</a>
    </div>
</div>
{% endblock %}
