{% extends "base.html" %}
{% block title %}Create household{% endblock %}
{% block content %}
<div class="panel">
    <h1>Create a household</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Create household</button>
    </form>
    <p><a href="{% url 'home' %}">Back to home</a></p>
</div>
{% endblock %}
