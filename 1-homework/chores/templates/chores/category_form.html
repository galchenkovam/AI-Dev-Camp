{% extends "base.html" %}
{% block title %}Create category{% endblock %}
{% block content %}
<div class="panel">
    <h1>Create a category for {{ household.name }}</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Create category</button>
    </form>
    <div class="row">
        <a href="{% url 'household-detail' household.id %}">Household home</a>
        <a href="{% url 'chore-list' household.id %}">Chores</a>
        <a href="{% url 'chore-calendar' household.id %}">Calendar</a>
    </div>
</div>
{% endblock %}
