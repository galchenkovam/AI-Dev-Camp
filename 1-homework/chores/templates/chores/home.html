{% extends "base.html" %}
{% block title %}Home{% endblock %}
{% block content %}
<div class="panel stack">
    <h1>Welcome, {{ user.username }}</h1>
    <div class="row">
        <a href="{% url 'household-create' %}">Create a household</a>
    </div>
    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Sign out</button>
    </form>
</div>
{% endblock %}
