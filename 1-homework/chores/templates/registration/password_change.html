{% extends "base.html" %}
{% block title %}Change password{% endblock %}
{% block content %}
<div class="panel">
    <h1>Change password</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Change password</button>
    </form>
    <p><a href="{% url 'profile' %}">Back to profile</a></p>
</div>
{% endblock %}
