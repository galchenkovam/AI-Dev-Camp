{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="panel">
    <h1>Sign in</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Sign in</button>
    </form>
    <div class="row">
        <a href="{% url 'register' %}">Create an account</a>
    </div>
</div>
{% endblock %}
