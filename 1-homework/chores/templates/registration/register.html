{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="panel">
    <h1>Create an account</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Register</button>
    </form>
    <p><a href="{% url 'login' %}">Sign in</a></p>
</div>
{% endblock %}
