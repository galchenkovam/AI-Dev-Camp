{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="panel">
    <h1>Create an account</h1>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            {% include "includes/form_field.html" %}
        {% endfor %}
        <button type="submit">Register</button>
    </form>
    <div class="row">
        <a href="{% url 'login' %}">Sign in</a>
    </div>
</div>
{% endblock %}
